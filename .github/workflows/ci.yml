name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Run Pester
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.6.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.6.0
          Invoke-Pester ./test -CI -Output Detailed

  self-test:
    name: Self-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Scan fixture with failing threshold
        id: failing
        uses: ./
        continue-on-error: true
        with:
          path: test/fixtures/sample/Sample.slnx
          suppressions-file: test/fixtures/sample/nuget-audit-suppressions.json
          max-suppression-days: 0

      - name: Scan fixture in report-only mode
        id: report-only
        uses: ./
        with:
          path: test/fixtures/sample/Sample.slnx
          suppressions-file: test/fixtures/sample/nuget-audit-suppressions.json
          max-suppression-days: 0
          fail-on-vulnerable: false
          restore: false

      - name: Check results
        shell: pwsh
        env:
          FAILING_OUTCOME: ${{ steps.failing.outcome }}
          FAILING_COUNT: ${{ steps.failing.outputs.failing-count }}
          SUPPRESSED_COUNT: ${{ steps.failing.outputs.suppressed-count }}
          REPORT_PATH: ${{ steps.report-only.outputs.report-path }}
          FINDINGS_PATH: ${{ steps.report-only.outputs.findings-path }}
        run: |
          $errors = @()
          if ($env:FAILING_OUTCOME -ne 'failure') { $errors += "Expected the scan to fail, got '$env:FAILING_OUTCOME'." }
          if ([int]$env:FAILING_COUNT -lt 1) { $errors += "Expected failing findings, got '$env:FAILING_COUNT'." }
          if ([int]$env:SUPPRESSED_COUNT -ne 2) { $errors += "Expected 2 suppressed findings, got '$env:SUPPRESSED_COUNT'." }
          $findings = Get-Content -Raw $env:FINDINGS_PATH | ConvertFrom-Json
          $newtonsoft = $findings | Where-Object { $_.Package -eq 'Newtonsoft.Json' -and $_.Project -eq 'test/fixtures/sample/App/App.csproj' }
          if (-not $newtonsoft) { $errors += 'Expected Newtonsoft.Json in App/App.csproj among the findings.' }
          if (-not (Select-String -LiteralPath $env:REPORT_PATH -Pattern '### Unused suppressions' -Quiet)) { $errors += 'Expected the unused suppression in the report.' }
          if ($errors) { $errors | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          Write-Host 'Self-test passed.'

  invalid-suppressions:
    name: Invalid suppressions fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Write a suppression beyond the limit
        shell: pwsh
        run: |
          $until = (Get-Date).AddDays(365).ToString('yyyy-MM-dd')
          @{ suppressions = @(@{ advisory = 'GHSA-5crp-9r3c-p9vr'; until = $until; reason = 'too long' }) } |
            ConvertTo-Json -Depth 4 | Set-Content "$env:RUNNER_TEMP/too-long.json"
      - name: Scan with the invalid suppression
        id: scan
        uses: ./
        continue-on-error: true
        with:
          path: test/fixtures/sample/Sample.slnx
          suppressions-file: ${{ runner.temp }}/too-long.json
          fail-on-vulnerable: false
      - name: Check the scan failed
        shell: pwsh
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          if ($env:OUTCOME -ne 'failure') { Write-Host "::error::Expected failure, got '$env:OUTCOME'."; exit 1 }
